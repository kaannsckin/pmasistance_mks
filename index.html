
<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://cdn-icons-png.flaticon.com/512/2098/2098402.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="/manifest.json" />
    <title>Proje Planlama Asistanı | Akıllı Web Aracı</title>
    <script>
      // Gece modu, uygulama yüklenmeden uygulanır ki açılışta ekran bir an beyaz parlamasın.
      // App, Ayarlar'daki Gündüz / Gece / Sistem tercihini bu anahtara da yazar.
      (function () {
        try {
          var m = localStorage.getItem('pm-color-mode');
          var dark = m === 'dark' || (m !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
<style>
  /* --- THEME SYSTEM --- */
  :root {
    --app-primary: #2563eb;
    --app-primary-dark: #1d4ed8;
    --app-accent: #3b82f6;
    --app-accent-light: #eff6ff;
    --app-ring: rgba(37, 99, 235, 0.2);
  }

  .theme-emerald {
    --app-primary: #059669;
    --app-primary-dark: #047857;
    --app-accent: #10b981;
    --app-accent-light: #ecfdf5;
    --app-ring: rgba(5, 150, 105, 0.2);
  }

  .theme-purple {
    --app-primary: #7c3aed;
    --app-primary-dark: #6d28d9;
    --app-accent: #8b5cf6;
    --app-accent-light: #f5f3ff;
    --app-ring: rgba(124, 58, 237, 0.2);
  }

  .theme-orange {
    --app-primary: #ea580c;
    --app-primary-dark: #c2410c;
    --app-accent: #f59e0b;
    --app-accent-light: #fff7ed;
    --app-ring: rgba(234, 88, 12, 0.2);
  }

  .text-primary { color: var(--app-primary); }
  .bg-primary { background-color: var(--app-primary); }
  .bg-accent { background-color: var(--app-accent-light); }
  .border-primary { border-color: var(--app-primary); }
  
  /* Smooth Transitions */
  * {
    transition: background-color 0.2s ease, border-color 0.2s ease, color 0.1s ease;
  }

  body {
    overscroll-behavior-y: contain;
    -webkit-tap-highlight-color: transparent;
  }
</style>
</head>
  <body class="bg-gray-50 dark:bg-gray-900 text-slate-800 dark:text-slate-100 antialiased selection:bg-blue-100 dark:selection:bg-blue-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
