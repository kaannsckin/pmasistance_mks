# PlanAsistan yerel sürümü (tek dosyalık exe): derleme, Windows'ta açılış denemesi
# ve etiketli sürümlerde (v*) GitHub Releases'a yükleme. Ayrıntı: scripts/build-exe.mjs
name: Exe

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'pilot-data/**'
  # Çalışma dallarında yalnız exe ile ilgili dosyalar değişince
  pull_request:
    paths:
      - 'server/local/**'
      - 'scripts/build-exe.mjs'
      - 'vite.local.config.ts'
      - '.github/workflows/exe.yml'
  workflow_dispatch:

concurrency:
  group: exe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .cache/node
          key: node-dist-${{ runner.os }}-v22
      - run: npm ci
      - run: npm run build:exe -- win-x64 linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: PlanAsistan
          path: release/*.zip
          retention-days: 14

  # Exe gerçekten Windows'ta açılıyor mu: başlat, sağlık ucunu ve arayüzü iste, ayar dosyası oluştu mu bak
  windows-smoke:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PlanAsistan
      - name: Exe'yi başlat ve dene
        shell: pwsh
        run: |
          Expand-Archive PlanAsistan-win-x64.zip -DestinationPath t
          $dir = Resolve-Path t\PlanAsistan
          $p = Start-Process -FilePath "$dir\PlanAsistan.exe" -ArgumentList '--no-browser' -WorkingDirectory $dir -PassThru `
            -RedirectStandardOutput "$dir\out.log" -RedirectStandardError "$dir\err.log"
          $health = $null
          for ($i = 0; $i -lt 40 -and -not $health; $i++) {
            try { $health = Invoke-RestMethod http://localhost:5180/api/integrations/health } catch { Start-Sleep -Seconds 1 }
          }
          Get-Content "$dir\out.log", "$dir\err.log"
          if (-not $health) { throw 'Sunucu açılmadı' }
          $health | ConvertTo-Json -Compress
          $page = Invoke-WebRequest http://localhost:5180/ -UseBasicParsing
          if ($page.Content -notmatch 'id="root"') { throw 'Arayüz sunulmadı' }
          $js = [regex]::Match($page.Content, 'src="(/assets/index-[^"]+\.js)"').Groups[1].Value
          if (-not $js) { throw 'Betik bağlantısı yok' }
          $asset = Invoke-WebRequest "http://localhost:5180$js" -UseBasicParsing
          if ($asset.RawContentLength -lt 100000) { throw 'Gömülü betik eksik' }
          if (-not (Test-Path "$dir\planasistan.env")) { throw 'Ayar dosyası oluşmadı' }
          if (-not (Test-Path "$dir\planasistan-veri\gizli-anahtar.txt")) { throw 'Veri klasörü oluşmadı' }
          Stop-Process -Id $p.Id -Force
          Write-Host 'Windows exe denemesi geçti.'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PlanAsistan
      - uses: softprops/action-gh-release@v2
        with:
          files: PlanAsistan-*.zip
          generate_release_notes: true
